name: Pins update

# Bumps the pins that pass the compatibility suite, checks the bumped tree on
# Linux and macOS, then pushes the bump to main and tags the release itself.
# Pushes made with the workflow token start no other workflow, so this workflow
# runs every check that CI and the release workflow would run.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# One update at a time, so two runs never push the same bump.
concurrency:
  group: pins-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      blocked: ${{ steps.select.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pins-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pins-${{ runner.os }}-
      - run: python3 -B scripts/pins/test_update.py
      - run: cargo build --release --locked -p muniment-pins --features cli
      # Check, bump, and keep every pin that passes compat and the workspace tests on Linux.
      - id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/pins/update.py select --out update.json
      - if: steps.select.outputs.changed == 'true'
        run: git diff --binary -- pins > pins.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pins-update
          path: |
            update.json
            pins.patch
          if-no-files-found: ignore

  # The checks CI runs on Linux, against the bumped tree.
  checks:
    needs: select
    if: needs.select.outputs.changed == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: router
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MUNIMENT_ROUTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pins-update
      - run: git apply pins.patch
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pins-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pins-checks-${{ runner.os }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --features muniment-pins/cli -- -D warnings
      - run: cargo clippy -p muniment-router --all-targets --features server --locked -- -D warnings
      - run: cargo test -p muniment-router --features server --locked -- --test-threads=1
      - run: scripts/check-core-boundary.sh
      - run: python3 -B scripts/test_release.py

  # The darwin archive, the macOS runtime, and the workspace tests on macOS.
  darwin:
    needs: select
    if: needs.select.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pins-update
      - run: git apply pins.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pins-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pins-${{ runner.os }}-
      - id: compat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo run --release --locked -p muniment-pins --features cli -- compat --report darwin.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pins-darwin
          path: darwin.json
          if-no-files-found: ignore
      - run: cargo test --workspace --locked --features muniment-core/network-tests,muniment-pins/cli -- --test-threads=1

  # Lands the bump and tags the release when every check passed, and files the
  # blocked-pin issues. It shares the release workflow's group, so tags stay in order.
  publish:
    needs: [select, checks, darwin]
    if: always() && needs.select.result == 'success' && (needs.select.outputs.changed == 'true' || needs.select.outputs.blocked == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pins-update
      - uses: actions/download-artifact@v4
        if: needs.select.outputs.changed == 'true'
        continue-on-error: true
        with:
          name: pins-darwin
      - if: needs.select.outputs.changed == 'true'
        run: git apply pins.patch && rm pins.patch
      - if: needs.select.outputs.changed == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - uses: actions/cache@v4
        if: needs.select.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pins-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pins-${{ runner.os }}-
      - name: Land the bump, tag the release, and file issues
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: ${{ needs.checks.result == 'success' && needs.darwin.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -B scripts/pins/update.py publish --result update.json --darwin darwin.json \
            --checks "$CHECKS" --run-url "$RUN_URL"
