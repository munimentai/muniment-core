name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  # The release workflow runs these jobs for every push to main.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked --features muniment-pins/cli -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      # Stub child processes starve under default test parallelism.
      - run: cargo test --workspace --locked --features muniment-core/network-tests,muniment-pins/cli -- --test-threads=1
      - if: runner.os == 'Linux'
        run: python3 -B scripts/test_release.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ runner.os }}-
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --locked --package muniment-atomic-file --package muniment-pins --package muniment-attach --features muniment-attach/client
      # The Windows-only core paths: known folders, the runtime task, attach pipes and ACLs.
      - run: >-
          cargo test --locked --package muniment-core
          --test windows_known_folders --test windows_sid --test windows_task_service
          --test attach_windows_listener --test attach_windows_instance_lock
          --test attach_windows_connect --test attach_windows_credential
          --test attach_windows_stream --test attach_windows_peer_native
          --test attach_windows_route_native --test attach_windows_session
      - run: >-
          cargo test --locked --package muniment-core --lib --
          windows_task_service windows_user_diagnostics agents::tests memory_files::tests
          pi_settings::tests

  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: boundary-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: boundary-${{ runner.os }}-
      - run: scripts/check-core-boundary.sh

  router-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: router
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # OpenBao integration runs only when MUNIMENT_ROUTER_TEST_OPENBAO_ADDR is
      # set. The OpenBao client tests run against a stand-in server always.
      MUNIMENT_ROUTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/router
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: router-server-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: router-server-${{ runner.os }}-
      - run: cargo clippy -p muniment-router --all-targets --features server --locked -- -D warnings
      - run: cargo test -p muniment-router --features server --locked -- --test-threads=1
      - run: docker build -f deploy/router/Containerfile -t muniment-router:ci .
