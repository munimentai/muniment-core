name: Release

on:
  push:
    branches: [main]

# Releases run one at a time, so each sees the tags of the one before it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish the next version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release.py --revision "$GITHUB_SHA" --publish --asset pins/pins.toml
