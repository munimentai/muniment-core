[package]
name = "muniment-core"
version = "0.0.1"
edition = "2021"

# Pure backend logic (sidecar lifecycle, RPC framing, OIDC auth engine).
# Deliberately free of Tauri and GUI dependencies so `cargo test` compiles
# and runs on the shared CI runner without the GUI toolchain a desktop-ci
# build VM provides. TLS is feature-gated for the same reason: the auth
# tests speak plain HTTP to an in-process mock IdP, so the standalone crate
# never compiles a TLS stack; the desktop crate enables `tls` to reach the
# real HTTPS control plane.

[features]
# The desktop crate turns on rustls with the ring provider through ureq.
tls = ["ureq/tls", "ureq/native-certs", "ureq/proxy-from-env"]
keyring = ["dep:keyring"]
network-tests = ["tls"]

[dependencies]
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
ed25519-dalek = "2"
getrandom = "0.3"
hmac = "0.12"
hound = "3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"], optional = true }
muniment-attach = { path = "../attach" }
muniment-code-diff = { path = "../code-diff" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sherpa-onnx = { version = "=1.13.2", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "=1.13.2", default-features = false, features = ["shared"] }
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# Tests need to author AES-encrypted entries to exercise the encrypted-entry
# rejection; the library itself only ever reads and needs no crypto stack.
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
