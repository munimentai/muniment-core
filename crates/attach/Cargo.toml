[package]
name = "muniment-attach"
version = "0.0.1"
edition = "2021"

[features]
default = []
# The client also carries the TLS transport, pinned to one runtime
# certificate, that the remote attach route and its clients share.
client = ["dep:rustls"]

[lib]
path = "src/lib.rs"

[dependencies]
getrandom = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"
uuid = "1"

# Pairs with or reconnects to a runtime over the remote route, for smoke tests.
[[example]]
name = "remote-smoke"
required-features = ["client"]
